# ros2_control for jetrover_sim.urdf.xacro (prd/gazebo-sim.md). Format follows gz_ros2_control_demos
# mecanum_drive_controller.yaml (Jazzy). 한글: 시뮬레이션 컨트롤러 설정.
controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
    arm_position_controller:
      type: forward_command_controller/ForwardCommandController
    # MoveIt용(arm_mode:=moveit, 2026-10-17): 실기 브리지와 같은 이름의 FollowJointTrajectory 컨트롤러 — moveit_controllers.yaml을
    # 그대로 쓴다. arm_position_controller와 같은 관절을 쓰므로 둘 중 하나만 띄운다(sim.launch.py가 고름).
    # For MoveIt: same names as the real bridge's FollowJointTrajectory servers, so moveit_controllers.yaml is reused.
    # They claim the same joints as arm_position_controller: sim.launch.py starts one set or the other.
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

mecanum_drive_controller:
  ros__parameters:
    use_sim_time: true
    reference_timeout: 0.5          # same as base_node cmd_vel_timeout / base_node와 같은 0.5 s
    front_left_wheel_command_joint_name: "wheel_left_front_joint"
    front_right_wheel_command_joint_name: "wheel_right_front_joint"
    rear_right_wheel_command_joint_name: "wheel_right_back_joint"
    rear_left_wheel_command_joint_name: "wheel_left_back_joint"
    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.0485                            # base.yaml wheel_diameter 0.097 / 2
      sum_of_robot_center_projection_on_X_Y_axis: 0.2096  # lx 0.0975 + ly 0.1121 (URDF wheel joints)
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: false            # EKF publishes odom -> base_footprint like on the robot / 실기처럼 EKF가 TF

arm_position_controller:
  ros__parameters:
    use_sim_time: true
    joints: [joint1, joint2, joint3, joint4, joint5, r_joint]
    interface_name: position

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [joint1, joint2, joint3, joint4, joint5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false

# 그리퍼: 물체에 막히면 목표 위치에 못 가므로 목표 허용 오차를 검사하지 않는다(0 = 검사 안 함, JTC 기본).
# Gripper: it stops on the object, so the goal position tolerance is not checked (0 = unchecked, JTC default).
gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints: [r_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

