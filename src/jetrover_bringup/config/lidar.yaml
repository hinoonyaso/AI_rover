# RPLIDAR A1 (A1M8, firmware 1.29 confirmed with GET_INFO). The CH340 adapter has no serial
# number, so the port is addressed by its physical USB path (keep the LiDAR in the same USB port).
rplidar_composition:
  ros__parameters:
    serial_port: /dev/serial/by-path/platform-3610000.usb-usb-0:2.1.4:1.0-port0
    serial_baudrate: 115200
    frame_id: lidar_frame
    inverted: false
    angle_compensate: true
