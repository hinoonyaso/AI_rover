# MPPI primary controller for the DWB vs MPPI A/B (prd/nav2-mppi-ab-test-plan.md, started 2026-10-09 with user approval,
# ahead of the encoder stage). Only the controller differs from nav2_params.yaml: costmaps, velocity limits (0.12 m/s,
# no reverse), collision_monitor and the RotationShim wrapper (same thresholds) are shared.
# tools/nav/ab_params/make_variants.sh merges this into FollowPath -> nav2_params_mppi.yaml.
# 한글: DWB 대신 MPPI(Omni, 메카넘). 컨트롤러만 다르고 나머지는 nav2_params.yaml과 같다. 시작값은 Nav2 Jazzy 예제 기반.
primary_controller: "nav2_mppi_controller::MPPIController"
time_steps: 40              # 40 x 0.1 s = 4 s horizon (~0.5 m at 0.12 m/s)
model_dt: 0.1               # = 1/controller_frequency
batch_size: 1000            # Jazzy example 2000; halved for the Orin Nano CPU budget (check controller rate)
vx_std: 0.2
vy_std: 0.2
wz_std: 0.2                 # 0.4 -> 0.2 (2026-10-09): fewer rotating samples, keep facing forward while avoiding / 회피 중 정면 유지
vx_max: 0.12
vx_min: 0.0                 # no reverse: rear is a sensor blind spot (troubleshooting/022)
vy_max: 0.12
wz_max: 0.4
ax_max: 0.5
ax_min: -0.5
ay_max: 0.5
az_max: 1.0
iteration_count: 1
prune_distance: 1.2
transform_tolerance: 0.2
temperature: 0.3
gamma: 0.015
motion_model: "Omni"
visualize: false
regenerate_noises: true
critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic",
          "PathFollowCritic", "TwirlingCritic", "VelocityDeadbandCritic", "LateralRatioCritic"]  # PathAngleCritic removed 2026-10-09 (M6)
# LateralRatioCritic (jetrover_nav_plugins, prd/mppi-lateral-ratio-critic.md, 2026-10-09): keep the travel direction
# within 45 deg of the body (front-only depth camera, FOV ~+-41 deg) while letting the mecanum base slide diagonally.
# 한글: 진행 방향을 몸 정면 45도 이내로(정면 카메라), 그 안에서는 대각 이동을 자유롭게.
LateralRatioCritic: {enabled: true, cost_power: 1, cost_weight: 50.0, max_angle_deg: 45.0, slack: 0.02}
ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
# threshold_to_consider shortened 2026-10-09 (repeat run R2): with the example values (path critics off / goal critic on
# within 1.0 m) the 1.1 m test lane switched to "head straight for the goal" after 10-20 cm, straight through the box,
# and MPPI got trapped in front of it although the global plan went around (+18 cm). Path following now lasts until 0.35 m.
# 한글: 예제값(목표 1.0 m 안에서 경로 추종 끄고 목표 직행)이면 1.1 m 시험 구간에서 출발 직후 상자를 향해 직진해 갇혔다.
GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.35}
GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.3}  # 0.5 -> 0.3 (2026-10-09)
CostCritic:
  enabled: true
  cost_power: 1
  cost_weight: 3.81
  critical_cost: 300.0
  consider_footprint: true    # rectangular footprint (0.36 x 0.50)
  collision_cost: 1000000.0
  near_goal_distance: 0.5
  trajectory_point_step: 2
PathAlignCritic:
  enabled: true
  cost_power: 1
  cost_weight: 6.0   # 14 -> 6 (2026-10-09): follow the plan loosely, sidestep near obstacles within 45 deg / 경로를 느슨하게 따라 장애물 근처에선 직접 비켜감
  max_path_occupancy_ratio: 0.05
  trajectory_point_step: 4
  threshold_to_consider: 0.3   # 0.5 -> 0.3 (2026-10-09)
  offset_from_furthest: 20
  use_path_orientations: false
PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 3.0,  # 5 -> 3 (2026-10-09)
                    offset_from_furthest: 5, threshold_to_consider: 0.35}  # 1.0 -> 0.35 (2026-10-09)
# mode 0 = keep the body pointed along the path. DISABLED 2026-10-09 (trial M6): it still turned the body +31 deg along the
# detour with Twirling 30; big direction changes are the RotationShim's job. 한글: 회피 중 몸을 경로 쪽으로 돌려서 끔(큰 전환은 shim).
PathAngleCritic: {enabled: false, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4, threshold_to_consider: 0.5, max_angle_to_furthest: 1.0, mode: 0}
# 10 -> 30 (2026-10-09, user requirement): avoid by sliding diagonally while facing forward (mecanum), not by turning the
# body 50-70 deg as in box trials M3-M5; big direction changes are left to the RotationShim (60 deg).
# 한글: 회피는 정면 유지 + 대각 이동(메카넘), 몸 회전은 큰 방향 전환에서만(shim 60도).
TwirlingCritic: {enabled: true, cost_power: 1, cost_weight: 30.0}
# wheel dead zone (2026-10-07: 0.006 m/s / 0.02 rad/s commands did not turn the wheels) / 모터 데드존
# wz deadband 0.1 -> 0 (2026-10-09, trial M7): penalizing |wz| < 0.1 made MPPI prefer turning at 0.12-0.16 rad/s over
# exactly 0 -> the body kept turning (+38 deg) while avoiding. In-place turns are done by the shim at 0.4 rad/s anyway.
# 한글: 회전 데드존 벌점이 '회전 0' 대신 0.1 이상 회전을 고르게 만들어 회피 중 몸이 돌았다 → 회전은 제외.
VelocityDeadbandCritic: {enabled: true, cost_power: 1, cost_weight: 35.0, deadband_velocities: [0.04, 0.04, 0.0]}
