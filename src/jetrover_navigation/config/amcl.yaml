# AMCL for the JetRover (mecanum -> omni motion model, since it can strafe/vy
# unlike a differential-drive robot). base_frame/odom_frame match the EKF
# (odom -> base_footprint) already used by jetrover_base/jetrover_bringup.
#
# initial_pose is a GUESS (0,0,0 = wherever the robot was when the saved map's
# SLAM run started) -- verify/correct it against where the robot actually is
# when localization starts, or set it live via RViz "2D Pose Estimate" /
# the /initialpose topic instead of relying on this default.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    update_min_d: 0.1
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.2
    max_beams: 60
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0

    set_initial_pose: true
    initial_pose:
      # Temporarily nudged 2026-10-05 for a one-off obstacle-avoidance test:
      # (0,0,0) sits exactly on an occupied map cell (robot started mapping
      # right next to a wall), which made planner_server reject every goal
      # with "Start occupied". (0.15, -0.02) is the nearest free cell in the
      # same spot, not a real re-measured position. Revert to (0,0,0) once
      # this is no longer needed, or replace with an actual 2D Pose Estimate.
      x: 0.15
      y: -0.02
      z: 0.0
      yaw: 0.0

    always_reset_initial_pose: false
    first_map_only: false
    tf_broadcast: true
