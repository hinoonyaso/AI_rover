# Gazebo 경광등 점검 임무 전용 (2026-11-23 추적 시작). 2026-10-11 make_variants.sh로 생성한 nav2_params_mppi.yaml 그대로다.
# 점검 시야·근접 정지가 MPPI 기준으로 검증됐고, 검증 시뮬 변형(sim_tol05, DWB)+3 cm 허용으로는 픽스처 앞에서 No valid trajectories로 진행 불가(troubleshooting/065).
# Stack-light inspection only: the 2026-10-11 nav2_params_mppi.yaml, now tracked so Jetson and host use the same file. Not a real-robot config.
# GENERATED by make_variants.sh from nav2_params.yaml + mppi_followpath.yaml -- do not edit
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: '[[0.19, 0.14], [0.19, -0.14], [-0.19, -0.14], [-0.19, 0.14]]'
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - obstacle_layer
      - depth_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          obstacle_max_range: 12.0
      depth_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: depth_cloud
        depth_cloud:
          topic: /depth_cam/depth/points_sparse
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 3.0
          obstacle_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.25
